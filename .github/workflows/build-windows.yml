name: Build, Test & Release Windows Installers

on:
  push:
    branches:
      - main
      - 'arena/**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release_tag:
        description: 'Optional release tag to publish/update (e.g. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-test-package:
    name: Windows (.NET 8 + Inno Setup) Build, Test & Installers
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Extract version metadata
        id: meta
        shell: pwsh
        run: |
          [xml]$csproj = Get-Content src/AutoZamena.App/AutoZamena.App.csproj
          $ver = ($csproj.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1).Trim()
          if ([string]::IsNullOrWhiteSpace($ver)) { $ver = "1.0.0" }
          $tag = ""
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $tag = "${{ github.ref_name }}"
            $ver = $tag.TrimStart('v')
          } elseif (-not [string]::IsNullOrWhiteSpace("${{ inputs.publish_release_tag }}")) {
            $tag = "${{ inputs.publish_release_tag }}".Trim()
            $ver = $tag.TrimStart('v')
          } elseif ("${{ github.event_name }}" -eq "push") {
            $tag = "v$ver"
          }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "release_tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "AppVersion=$ver, ReleaseTag=$tag"

      - name: Restore dependencies
        run: dotnet restore AutoZamena.sln

      - name: Build solution (Release)
        run: dotnet build AutoZamena.sln -c Release --no-restore -p:Version=${{ steps.meta.outputs.version }}

      - name: Run xUnit tests & latency benchmarks
        shell: pwsh
        run: |
          $output = dotnet test tests/AutoZamena.Tests/AutoZamena.Tests.csproj -c Release --no-build --verbosity normal 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0) {
            $lines = ($output -split "`r?`n" | Where-Object { $_ -notmatch "^\s*Passed\s" -and ($_ -match "Failed|Expected:|Actual:|Assert|\[FAIL\]") }) -join " | "
            if ([string]::IsNullOrWhiteSpace($lines)) {
              $lines = ($output -split "`r?`n" | Select-Object -Last 25) -join " | "
            }
            Write-Output "::error title=xUnit Test Failure::$lines"
            exit 1
          }

      - name: Publish Standalone Single-File .exe (no .NET install required)
        run: >
          dotnet publish src/AutoZamena.App/AutoZamena.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:Version=${{ steps.meta.outputs.version }}
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -o publish/standalone

      - name: Publish Lightweight Single-File .exe (.NET 8 Desktop Runtime)
        run: >
          dotnet publish src/AutoZamena.App/AutoZamena.App.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:Version=${{ steps.meta.outputs.version }}
          -p:PublishSingleFile=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -o publish/light

      - name: Build Windows Setup Installers (Inno Setup 6) & Portable ZIP
        shell: pwsh
        run: |
          $ver = "${{ steps.meta.outputs.version }}"
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) {
            throw "ISCC.exe not found after Inno Setup check."
          }

          # 1. Full Offline Windows Installer (Recommended — works on any Windows 10/11 x64 without .NET)
          & $iscc `
            "/DMyAppVersion=$ver" `
            "/DPublishDir=..\publish\standalone" `
            "/DOutputBaseFilename=AutoZamena-Setup-win-x64" `
            installer\AutoZamena.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed for standalone installer" }

          # 2. Lightweight Windows Installer (requires .NET 8 Desktop Runtime)
          & $iscc `
            "/DMyAppVersion=$ver" `
            "/DPublishDir=..\publish\light" `
            "/DEditionSuffix= (Light)" `
            "/DOutputBaseFilename=AutoZamena-Light-Setup-win-x64" `
            installer\AutoZamena.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed for light installer" }

          # 3. Portable ZIP Archive (with pre-created portable.flag)
          New-Item -ItemType Directory -Force -Path staging/AutoZamena-Portable | Out-Null
          Copy-Item publish/standalone/AutoZamena.exe staging/AutoZamena-Portable/AutoZamena.exe
          Copy-Item LICENSE staging/AutoZamena-Portable/LICENSE.txt
          New-Item -ItemType File -Force -Path staging/AutoZamena-Portable/portable.flag | Out-Null
          @"
          AutoZamena v$ver — Портативная версия (без установки)
          ======================================================
          1. Запустите AutoZamena.exe — в системном трее (рядом с часами) появится значок RU / EN.
          2. Благодаря файлу portable.flag все настройки и ваш личный словарь сохраняются прямо в этой папке (config.json).
          3. Основные жесты (в стиле Caramba Switcher):
             - Двойной Shift (2x Shift): перевести последнее слово / отменить автопереключение / перевести выделенный текст
             - Левый Shift + Правый Shift: пауза / включение
             - Двойной Ctrl (2x Ctrl): перевести всю текущую строку
             - Ctrl + Alt + K / Ctrl + Alt + T: регистр / транслитерация выделенного текста
          "@ | Set-Content -Path staging/AutoZamena-Portable/ПРОЧТИ_МЕНЯ.txt -Encoding UTF8

          Compress-Archive -Path staging/AutoZamena-Portable/* -DestinationPath artifacts/AutoZamena-Portable-win-x64.zip -Force

          # 4. Standalone single-file .exe & SHA-256 checksums
          Copy-Item publish/standalone/AutoZamena.exe artifacts/AutoZamena-Standalone-win-x64.exe

          Push-Location artifacts
          $hashLines = Get-ChildItem -File | Sort-Object Name | ForEach-Object {
            $h = (Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLowerInvariant()
            "$h  $($_.Name)"
          }
          $hashLines | Set-Content -Path SHA256SUMS.txt -Encoding ASCII
          Get-ChildItem -File | Format-Table Name, Length -AutoSize
          Get-Content SHA256SUMS.txt
          Pop-Location

      - name: Upload Windows Installers & Portable Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoZamena-Windows-Installers-x64
          path: artifacts/*
          if-no-files-found: error

      - name: Publish or Update GitHub Release
        if: steps.meta.outputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.meta.outputs.release_tag }}"
          $ver = "${{ steps.meta.outputs.version }}"

          $notes = @"
          ## 📦 Скачать AutoZamena $tag для Windows 10 / 11 (x64)

          | Пакет | Описание | Кому подойдёт |
          |---|---|---|
          | 🏆 **[AutoZamena-Setup-win-x64.exe](https://github.com/ToshakGulina/windows-autozamena/releases/download/$tag/AutoZamena-Setup-win-x64.exe)** | **Полный установщик Windows** *(всё включено, не требует .NET)* | **Рекомендуется для всех пользователей** — установка в 2 клика без прав администратора, ярлык в меню «Пуск» и автозапуск |
          | 🪶 **[AutoZamena-Light-Setup-win-x64.exe](https://github.com/ToshakGulina/windows-autozamena/releases/download/$tag/AutoZamena-Light-Setup-win-x64.exe)** | Облегчённый установщик (~2–3 МБ) | Если в системе уже установлен `.NET 8 Desktop Runtime (x64)` |
          | 💼 **[AutoZamena-Portable-win-x64.zip](https://github.com/ToshakGulina/windows-autozamena/releases/download/$tag/AutoZamena-Portable-win-x64.zip)** | Портативный архив с `portable.flag` | Работа с флешки или из любой папки без установки в систему |
          | ⚡ **[AutoZamena-Standalone-win-x64.exe](https://github.com/ToshakGulina/windows-autozamena/releases/download/$tag/AutoZamena-Standalone-win-x64.exe)** | Один автономный `.exe`-файл | Прямой запуск одним файлом |

          ---

          ### ✨ Главные возможности релиза $tag
          - **Мгновенное исправление опечаток на лету (`< 1 мс`)** по физическому расстоянию клавиш **ЙЦУКЕН / QWERTY**, таймингам нажатий и `75 000+` биграммам (`возврапщатся наза ` → **`возвращаться назад `**).
          - **Управление как в Caramba Switcher (без `Pause/Break`):**
            - **`2× Shift`** — перевод последнего слова, отмена автопереключения (с самообучением!) или умный перевод выделенного текста с сохранением URL и буфера обмена;
            - **`Левый Shift + Правый Shift`** — мгновенная пауза / включение;
            - **`1× Shift`** *(опционально в трее)* — смена системной раскладки;
            - **`2× Ctrl`** — перевод всей текущей строки.
          - **Умная раскладка (`RU ↔ EN`):** ретроактивные фразы (`z yt pyf. ` → `я не знаю `), знаки препинания (`ghbdtn? vbh ` → `привет, мир `, `rfr ltkf& ` → `как дела? `) и домены (`пщщпдуюсщь ` → `google.com `, `цццюнфюкг ` → `www.ya.ru `).
          - **Смартфонная механика и сниппеты:** автоотключение случайного `Caps Lock` (`пРИВЕТ` → `Привет`), склейка раннего пробела (`приве т ` → `привет `), двойной пробел → `". "`, длинное тире ` -- ` → ` — `, макросы `{{date}}`, `{{clipboard}}` и курсор `|`.
          - **100% офлайн и безопасно:** ноль сетевых соединений, автоотключение в 3D-играх и полях ввода паролей.

          > Контрольные суммы SHA-256 приложены в файле `SHA256SUMS.txt`.
          "@
          $notes | Set-Content -Path release_notes.md -Encoding UTF8

          $prevEap = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          gh release view $tag *> $null
          $releaseExists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = $prevEap

          $files = Get-ChildItem artifacts/* | ForEach-Object { $_.FullName }
          if ($releaseExists) {
            gh release upload $tag @files --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release upload failed" }
            gh release edit $tag --title "AutoZamena $tag — Умная автозамена и переключатель раскладки" --notes-file release_notes.md
            if ($LASTEXITCODE -ne 0) { throw "gh release edit failed" }
          } else {
            gh release create $tag @files `
              --target "${{ github.sha }}" `
              --title "AutoZamena $tag — Умная автозамена и переключатель раскладки" `
              --notes-file release_notes.md
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
          }
