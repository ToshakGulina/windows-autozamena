name: Build, Test & Release

on:
  push:
    branches:
      - main
      - 'arena/**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release_tag:
        description: 'Release tag to publish or update (e.g. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-test-package:
    name: Windows x64 (.NET 8 + Inno Setup)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Extract version metadata
        id: meta
        shell: pwsh
        run: |
          [xml]$csproj = Get-Content src/AutoZamena.App/AutoZamena.App.csproj
          $ver = ($csproj.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1).Trim()
          if ([string]::IsNullOrWhiteSpace($ver)) { $ver = "1.0.0" }
          $tag = ""
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $tag = "${{ github.ref_name }}"
            $ver = $tag.TrimStart('v')
          } elseif (-not [string]::IsNullOrWhiteSpace("${{ inputs.publish_release_tag }}")) {
            $tag = "${{ inputs.publish_release_tag }}".Trim()
            $ver = $tag.TrimStart('v')
          } elseif ("${{ github.event_name }}" -eq "push" -and "${{ github.ref }}" -eq "refs/heads/main") {
            $tag = "v$ver"
          }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "release_tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "AppVersion=$ver, ReleaseTag=$tag"

      - name: Restore dependencies
        run: dotnet restore AutoZamena.sln

      - name: Build solution (Release)
        run: dotnet build AutoZamena.sln -c Release --no-restore -p:Version=${{ steps.meta.outputs.version }}

      - name: Run tests
        shell: pwsh
        run: |
          $output = dotnet test tests/AutoZamena.Tests/AutoZamena.Tests.csproj -c Release --no-build --verbosity normal 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0) {
            $lines = ($output -split "`r?`n" | Where-Object { $_ -notmatch "^\s*Passed\s" -and ($_ -match "Failed|Expected:|Actual:|Assert|\[FAIL\]") }) -join " | "
            if ([string]::IsNullOrWhiteSpace($lines)) {
              $lines = ($output -split "`r?`n" | Select-Object -Last 25) -join " | "
            }
            Write-Output "::error title=xUnit Test Failure::$lines"
            exit 1
          }

      - name: Publish self-contained single-file executable
        run: >
          dotnet publish src/AutoZamena.App/AutoZamena.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:Version=${{ steps.meta.outputs.version }}
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -o publish/standalone

      - name: Publish framework-dependent single-file executable
        run: >
          dotnet publish src/AutoZamena.App/AutoZamena.App.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:Version=${{ steps.meta.outputs.version }}
          -p:PublishSingleFile=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -o publish/light

      - name: Build installers and portable archive
        shell: pwsh
        run: |
          $ver = "${{ steps.meta.outputs.version }}"
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) {
            throw "ISCC.exe not found after Inno Setup check."
          }

          # 1. Self-contained installer
          & $iscc `
            "/DMyAppVersion=$ver" `
            "/DPublishDir=..\publish\standalone" `
            "/DOutputBaseFilename=AutoZamena-Setup-win-x64" `
            installer\AutoZamena.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed for standalone installer" }

          # 2. Framework-dependent installer (.NET 8 Desktop Runtime)
          & $iscc `
            "/DMyAppVersion=$ver" `
            "/DPublishDir=..\publish\light" `
            "/DEditionSuffix= (Light)" `
            "/DOutputBaseFilename=AutoZamena-Light-Setup-win-x64" `
            installer\AutoZamena.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed for light installer" }

          # 3. Portable ZIP archive
          New-Item -ItemType Directory -Force -Path staging/AutoZamena-Portable | Out-Null
          Copy-Item publish/standalone/AutoZamena.exe staging/AutoZamena-Portable/AutoZamena.exe
          Copy-Item LICENSE staging/AutoZamena-Portable/LICENSE.txt
          New-Item -ItemType File -Force -Path staging/AutoZamena-Portable/portable.flag | Out-Null
          @"
          AutoZamena $ver — портативная сборка
          ------------------------------------
          Запустите AutoZamena.exe. Значок программы появится в области уведомлений (трее).
          Наличие файла portable.flag включает хранение настроек и словаря в текущей папке (config.json).

          Клавиши по умолчанию:
            Двойной Shift              перевод раскладки последнего слова, выделенного текста или отмена переключения
            Левый + Правый Shift       пауза и возобновление работы
            Двойной Ctrl               перевод раскладки всей текущей строки
            Ctrl + Alt + K             смена регистра выделенного текста
            Ctrl + Alt + T             транслитерация выделенного текста
          "@ | Set-Content -Path staging/AutoZamena-Portable/ПРОЧТИ_МЕНЯ.txt -Encoding UTF8

          Compress-Archive -Path staging/AutoZamena-Portable/* -DestinationPath artifacts/AutoZamena-Portable-win-x64.zip -Force

          # 4. Standalone executable & SHA-256 checksums
          Copy-Item publish/standalone/AutoZamena.exe artifacts/AutoZamena-Standalone-win-x64.exe

          Push-Location artifacts
          $hashLines = Get-ChildItem -File | Sort-Object Name | ForEach-Object {
            $h = (Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLowerInvariant()
            "$h  $($_.Name)"
          }
          $hashLines | Set-Content -Path SHA256SUMS.txt -Encoding ASCII
          Get-ChildItem -File | Format-Table Name, Length -AutoSize
          Get-Content SHA256SUMS.txt
          Pop-Location

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoZamena-Windows-Installers-x64
          path: artifacts/*
          if-no-files-found: error

      - name: Publish or update GitHub Release
        if: steps.meta.outputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.meta.outputs.release_tag }}"

          $notes = @"
          ### Загрузки для Windows 10 / 11 (x64)

          | Файл | Описание |
          |---|---|
          | **[AutoZamena-Setup-win-x64.exe](https://github.com/ToshakGulina/windows-autozamena/releases/download/$tag/AutoZamena-Setup-win-x64.exe)** | Полный установщик (автономный, не требует установки .NET и прав администратора) |
          | [AutoZamena-Light-Setup-win-x64.exe](https://github.com/ToshakGulina/windows-autozamena/releases/download/$tag/AutoZamena-Light-Setup-win-x64.exe) | Облегчённый установщик (требуется установленный `.NET 8 Desktop Runtime x64`) |
          | [AutoZamena-Portable-win-x64.zip](https://github.com/ToshakGulina/windows-autozamena/releases/download/$tag/AutoZamena-Portable-win-x64.zip) | Портативный архив с `portable.flag` (хранит `config.json` рядом с `AutoZamena.exe`) |
          | [AutoZamena-Standalone-win-x64.exe](https://github.com/ToshakGulina/windows-autozamena/releases/download/$tag/AutoZamena-Standalone-win-x64.exe) | Автономный исполняемый файл без установщика |

          ### Основные возможности
          - Исправление опечаток при наборе с учётом геометрии раскладок ЙЦУКЕН и QWERTY, транспозиций и контекста биграмм.
          - Автоматическое разделение случайно слитых слов и расстановка пропущенных дефисов частиц (`приветмир` → `привет мир`, `неработает` → `не работает`, `откуданибудь` → `откуда-нибудь`).
          - Автоматическое и ручное переключение раскладки `RU <-> EN` для отдельных слов, ретроактивных фраз, знаков препинания и доменных имён.
          - Управление клавишами-модификаторами: `2x Shift` (перевод последнего слова, выделенного фрагмента или отмена переключения), `Левый + Правый Shift` (пауза), `2x Ctrl` (перевод строки), опциональный `1x Shift` (смена раскладки).
          - Исправление случайного `Caps Lock` и двух заглавных букв в начале слова, склейка слов после сдвинутого пробела, пользовательский словарь исключений и текстовых замен.
          - Автоматическое отключение в IDE, терминалах, полноэкранных 3D-приложениях и полях ввода паролей. Полностью локальная работа без сетевых обращений.

          Контрольные суммы SHA-256 приведены в файле `SHA256SUMS.txt`.
          "@
          $notes | Set-Content -Path release_notes.md -Encoding UTF8

          $prevEap = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          gh release view $tag *> $null
          $releaseExists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = $prevEap

          $files = Get-ChildItem artifacts/* | ForEach-Object { $_.FullName }
          if ($releaseExists) {
            gh release upload $tag @files --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release upload failed" }
            gh release edit $tag --title "AutoZamena $tag" --notes-file release_notes.md
            if ($LASTEXITCODE -ne 0) { throw "gh release edit failed" }
          } else {
            gh release create $tag @files `
              --target "${{ github.sha }}" `
              --title "AutoZamena $tag" `
              --notes-file release_notes.md
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
          }
