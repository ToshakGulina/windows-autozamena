name: "🐛 Ошибка в приложении / Bug Report"
description: "Сообщить о техническом баге, сбое или несовместимости с программой"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: "Что произошло?"
      description: "Кратко опишите проблему и в каком приложении она проявилась."
      placeholder: "Например: в окне Telegram при двойном нажатии Shift не переводится выделенный текст..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Шаги воспроизведения"
      placeholder: |
        1. Открыть ...
        2. Набрать текст ...
        3. Нажать ...
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: "Версия Windows и версия AutoZamena"
      placeholder: "Windows 11 24H2, AutoZamena v1.0.0 (Setup x64)"
    validations:
      required: true
