name: "✨ Идея / Новая функция"
description: "Предложить улучшение механики, хоткеев или интерфейса"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: "Какую задачу или неудобство это решит?"
      placeholder: "Опишите сценарий использования..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: "Как это должно работать?"
      placeholder: "Опишите желаемое поведение..."
    validations:
      required: true
