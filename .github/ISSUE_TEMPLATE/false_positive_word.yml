name: "🔤 Ложное исправление или пропуск слова"
description: "Предложить слово в словарь исключений или пример опечатки, которая не исправилась"
title: "[Словарь]: "
labels: ["lexicon"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: "Тип ситуации"
      options:
        - "Ложное срабатывание (правильное слово / сленг / термин зря исправилось)"
        - "Пропуск очевидной опечатки или раскладки"
    validations:
      required: true
  - type: input
    id: typed
    attributes:
      label: "Что вы набрали (вместе с соседним словом, если важен контекст)"
      placeholder: "Например: запушил в репу"
    validations:
      required: true
  - type: input
    id: actual_vs_expected
    attributes:
      label: "Что получилось → что должно было получиться"
      placeholder: "Получилось: ... → Ожидалось: ..."
    validations:
      required: true
