<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 280" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1324"/>
      <stop offset="55%" stop-color="#0f1f33"/>
      <stop offset="100%" stop-color="#092926"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14c384"/>
      <stop offset="100%" stop-color="#0a786e"/>
