<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 330" width="100%">
  <rect x="2" y="2" width="1076" height="326" rx="18" fill="#0d1522" stroke="#1e293b" stroke-width="2"/>

  <!-- Left Column: Live Typing Corrections -->
  <text x="38" y="44" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#94a3b8">КАК ЭТО РАБОТАЕТ ПРИ ПЕЧАТИ (БЕЗ ОСТАНОВОК И БЕЗ БУФЕРА ОБМЕНА)</text>

  <g font-family="Consolas, 'Cascadia Code', 'Segoe UI Mono', monospace" font-size="16">
    <!-- Row 1 -->
    <rect x="38" y="64" width="600" height="44" rx="10" fill="#131f31" stroke="#24344d"/>
    <text x="56" y="92" fill="#f87171">возврапщатся наза␣</text>
    <text x="275" y="92" fill="#64748b">→</text>
    <text x="308" y="92" fill="#34d399" font-weight="700">возвращаться назад </text>

    <!-- Row 2 -->
    <rect x="38" y="118" width="600" height="44" rx="10" fill="#131f31" stroke="#24344d"/>
    <text x="56" y="146" fill="#f87171">z yt pyf.␣</text>
    <text x="275" y="146" fill="#64748b">→</text>
    <text x="308" y="146" fill="#34d399" font-weight="700">я не знаю </text>
    <text x="435" y="146" font-family="Segoe UI, sans-serif" font-size="13" fill="#94a3b8">(+ смена на RU)</text>

    <!-- Row 3 -->
    <rect x="38" y="172" width="600" height="44" rx="10" fill="#131f31" stroke="#24344d"/>
    <text x="56" y="200" fill="#f87171">rfr ltkf&amp; хорошо␣</text>
    <text x="275" y="200" fill="#64748b">→</text>
    <text x="308" y="200" fill="#34d399" font-weight="700">как дела? Хорошо </text>

    <!-- Row 4 -->
    <rect x="38" y="226" width="600" height="44" rx="10" fill="#131f31" stroke="#24344d"/>
    <text x="56" y="254" fill="#f87171">пщщпдуюсщь␣</text>
    <text x="275" y="254" fill="#64748b">→</text>
    <text x="308" y="254" fill="#60a5fa" font-weight="700">google.com </text>
    <text x="435" y="254" font-family="Segoe UI, sans-serif" font-size="13" fill="#94a3b8">(+ смена на EN)</text>
  </g>

  <text x="38" y="302" font-family="Segoe UI, sans-serif" font-size="14" fill="#94a3b8">
    🛡️ Не трогает код, ссылки (andriod.com), файлы (програма.exe), пароли и полноэкранные 3D-игры
  </text>

  <!-- Right Column: Caramba Switcher Keycaps -->
  <rect x="668" y="26" width="380" height="278" rx="14" fill="#111c2d" stroke="#263854" stroke-width="1.5"/>
  <text x="694" y="58" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#7dd3fc">ЖЕСТЫ CARAMBA (БЕЗ PAUSE/BREAK)</text>

  <g font-family="Segoe UI, sans-serif">
    <!-- Keycap 1 -->
    <rect x="694" y="76" width="118" height="32" rx="7" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="753" y="97" text-anchor="middle" font-size="13" font-weight="700" fill="#f8fafc">2× Shift</text>
    <text x="826" y="92" font-size="13" fill="#e2e8f0">Слово / отмена /</text>
    <text x="826" y="109" font-size="13" fill="#94a3b8">выделенный текст</text>

    <!-- Keycap 2 -->
    <rect x="694" y="128" width="118" height="32" rx="7" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="753" y="149" text-anchor="middle" font-size="12.5" font-weight="700" fill="#f8fafc">LShift + RShift</text>
    <text x="826" y="149" font-size="13" fill="#e2e8f0">Пауза / Включить</text>

    <!-- Keycap 3 -->
    <rect x="694" y="176" width="118" height="32" rx="7" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="753" y="197" text-anchor="middle" font-size="13" font-weight="700" fill="#f8fafc">1× Shift</text>
    <text x="826" y="197" font-size="13" fill="#e2e8f0">Смена языка (опц.)</text>

    <!-- Keycap 4 -->
    <rect x="694" y="224" width="118" height="32" rx="7" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="753" y="245" text-anchor="middle" font-size="13" font-weight="700" fill="#f8fafc">2× Ctrl</text>
    <text x="826" y="245" font-size="13" fill="#e2e8f0">Перевод всей строки</text>

    <text x="694" y="284" font-size="12.5" fill="#6ee7b7">✓ Идеально на ноутбуках и 65% / 75% клавиатурах</text>
  </g>
</svg>
